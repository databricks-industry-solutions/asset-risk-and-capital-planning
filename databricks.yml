# ARMOR: risk-ranked capital planning for an electric distribution utility, as one Declarative Automation Bundle.
#
# Deploy with the demo data (a fictional utility generated by the armor_demo job) into an existing catalog:
#     scripts/bundle.sh deploy --var catalog=<your_catalog>          # builds the app, deploys app + jobs
#     databricks bundle run armor_demo --var catalog=<your_catalog>  # demo data -> model -> outputs
#     databricks bundle run armor --var catalog=<your_catalog>       # start the app
# Every variable has a default; the only one you normally set is catalog. For your own data, see the README's
# "Make it yours": point input_schema at views over your tables and run armor_model instead of armor_demo.
bundle:
  name: asset_risk_capital_planning

include:
  - resources/*.yml
  # Optional per-deployment targets (Lakebase, Genie, another workspace): one file per deployment, kept out of git
  # (targets/example.yml.template shows the shape).
  - targets/*.yml

# The deployed app folder holds build outputs that git ignores (scripts/build_app.sh); sync them anyway.
sync:
  include:
    - app/client/dist/**
    - app/src/**
    - app/contract/**
    - app/config/**

variables:
  catalog:
    description: "Existing Unity Catalog to deploy into. The schemas below are created in it."
    default: main
  input_schema:
    description: "<catalog>.<schema> holding the asset data model: the demo data, or views over your own tables."
    default: ${var.catalog}.armor_demo_input
  output_schema:
    description: "<catalog>.<schema> the model job writes to and the app reads (created if missing)."
    default: ${var.catalog}.armor
  warehouse_id:
    description: "SQL warehouse the app queries through (looked up by name; override with --var warehouse_id=<id>)."
    lookup:
      warehouse: "Serverless Starter Warehouse"
  app_name:
    description: Databricks App name (lowercase, hyphens, 30 characters at most).
    default: armor-capital-planner
  lakebase_instance:
    description: "Optional Lakebase instance serving the app's asset lookups (tools/setup_serving.py); empty = read them from the SQL warehouse."
    default: ""
  lakebase_database:
    description: Postgres database in the Lakebase instance.
    default: armor
  genie_space_id:
    description: "Optional Genie space for the Ask page, over input_schema and output_schema; empty = the Ask page says none is configured."
    default: ""

targets:
  dev:
    default: true
    mode: development
